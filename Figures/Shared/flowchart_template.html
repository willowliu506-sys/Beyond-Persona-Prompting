<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flowchart Title</title>
  <link rel="stylesheet" href="flowchart_style.css">
  <style>
    @page { size: 800px 400px; margin: 0; }
    html, body, .canvas { width: 800px; height: 400px; }
  </style>
</head>
<body>
  <main class="canvas" role="img" aria-label="Describe the flowchart for screen readers">
    <div class="phase-title" style="left:200px;top:55px;width:400px;color:#0F6E56;">Phase Title</div>

    <section class="panel green-panel" style="left:200px;top:80px;width:400px;height:120px;"></section>

    <div class="node green-node" style="left:230px;top:118px;width:140px;height:44px;">Process A</div>
    <div class="arrow-right arrow-long" style="left:370px;top:140px;"></div>
    <div class="node green-strong-node" style="left:408px;top:118px;width:160px;height:44px;">Process B</div>

    <div class="arrow-down" style="left:488px;top:162px;height:36px;"></div>
    <div class="node neutral-node" style="left:428px;top:210px;width:120px;height:50px;">Output</div>
  </main>
</body>
</html>
