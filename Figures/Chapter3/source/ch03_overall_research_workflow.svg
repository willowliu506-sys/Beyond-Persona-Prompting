<svg viewBox="0 0 680 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Shared Experimental Workflow</title>
  <desc>The teaching and assessment phases are connected through a frozen post-exposure information state. Each assessment question independently branches from the same frozen state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th{font-size:14px;font-weight:500;font-family:-apple-system,system-ui,sans-serif}
    </style>
  </defs>

  <rect x="30" y="40" width="280" height="240" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="170" y="58" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0F6E56" font-family="-apple-system,system-ui,sans-serif">Teaching / learning phase</text>

  <rect x="70" y="80" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="170" y="102" text-anchor="middle" dominant-baseline="central" fill="#085041">Instructional Material</text>
  <path d="M170,124 L170,138" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="140" width="200" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="170" y="162" text-anchor="middle" dominant-baseline="central" fill="#085041">Learner-Specific Processing</text>
  <path d="M170,184 L170,198" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="200" width="200" height="56" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="170" y="220" text-anchor="middle" dominant-baseline="central" fill="#085041">Frozen Post-Exposure</text>
  <text class="th" x="170" y="238" text-anchor="middle" dominant-baseline="central" fill="#085041">Information State</text>

  <path d="M270,228 L340,228 L340,108 L406,108" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="370" y="40" width="280" height="240" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="510" y="58" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#185FA5" font-family="-apple-system,system-ui,sans-serif">Assessment phase</text>

  <rect x="410" y="80" width="200" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="510" y="100" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Frozen Post-Exposure State</text>
  <text class="th" x="510" y="118" text-anchor="middle" dominant-baseline="central" fill="#0C447C">+ Assessment Question</text>
  <path d="M510,136 L510,148" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="410" y="150" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="510" y="172" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Student Answer</text>
  <path d="M510,194 L510,206" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="410" y="210" width="200" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="510" y="232" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Criterion-Level Scoring</text>
</svg>
