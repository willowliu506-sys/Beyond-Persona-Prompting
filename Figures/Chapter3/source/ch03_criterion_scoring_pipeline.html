<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Criterion-Level Scoring and Validation Pipeline</title>
  <link rel="stylesheet" href="../../Shared/flowchart_style.css">
  <style>
    @page { size: 1490px 280px; margin: 0; }
    html, body, .canvas { width: 1490px; height: 280px; }
    .node { font-size: 24px; line-height: 28px; }
  </style>
</head>
<body>
  <main class="canvas" role="img" aria-label="Pipeline from a frozen source-grounded rubric through atomic checklist criteria, pointwise LLM judging, structured criterion labels, programmatic score aggregation, and human validation and repeatability testing">
    <div class="node neutral-node" style="left:30px;top:70px;width:220px;height:140px;">
      <span>Frozen source-grounded<br>rubric</span>
    </div>

    <div class="arrow-right" style="left:254px;top:140px;width:28px;"></div>

    <div class="node green-node" style="left:286px;top:70px;width:170px;height:140px;">
      <span>Atomic checklist<br>criteria</span>
    </div>

    <div class="arrow-right" style="left:460px;top:140px;width:28px;"></div>

    <div class="node blue-node" style="left:492px;top:70px;width:145px;height:140px;">
      <span>Pointwise<br>LLM Judge</span>
    </div>

    <div class="arrow-right" style="left:641px;top:140px;width:28px;"></div>

    <div class="node blue-strong-node" style="left:673px;top:70px;width:290px;height:140px;">
      <span>Structured criterion labels<br>(binary credit with diagnostic<br>error labels)</span>
    </div>

    <div class="arrow-right" style="left:967px;top:140px;width:28px;"></div>

    <div class="node green-node" style="left:999px;top:70px;width:190px;height:140px;">
      <span>Programmatic score<br>aggregation</span>
    </div>

    <div class="arrow-right" style="left:1193px;top:140px;width:28px;"></div>

    <div class="node neutral-node" style="left:1225px;top:70px;width:235px;height:140px;">
      <span>Human validation<br>and repeatability<br>testing</span>
    </div>
  </main>
</body>
</html>
