<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Study 1 Mechanism-Specific Validation Measures</title>
  <link rel="stylesheet" href="../../Shared/flowchart_style.css">
  <style>
    @page { size: 1270px 470px; margin: 0; }
    html, body, .canvas { width: 1270px; height: 470px; }

    .section-label {
      position: absolute;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      line-height: 16px;
      color: var(--neutral-text);
      text-align: left;
    }

    .metric-label {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      color: var(--blue-text);
      text-align: center;
      line-height: 16px;
      z-index: 5;
    }

    .metric-label strong {
      font-size: 14px;
      font-weight: 600;
    }

    .metric-label span {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 400;
      color: var(--neutral-text);
    }

    .fidelity-link {
      position: absolute;
      width: 0;
      border-left: var(--border-width) dashed var(--blue-stroke);
      z-index: 2;
    }

    .outcome-line {
      position: absolute;
      height: 0;
      border-top: var(--arrow-width) solid var(--arrow);
      z-index: 2;
    }

    .outcome-line::after {
      content: "";
      position: absolute;
      right: -1px;
      top: -4.25px;
      width: 7px;
      height: 7px;
      border-top: var(--arrow-width) solid var(--arrow);
      border-right: var(--arrow-width) solid var(--arrow);
      transform: rotate(45deg);
    }

    .outcome-tick {
      position: absolute;
      width: 0;
      border-left: var(--border-width) solid var(--arrow);
      z-index: 2;
    }
  </style>
</head>
<body>
  <main class="canvas" role="img" aria-label="Study 1 mechanism-specific validation measures across the CPB information flow">
    <div class="section-label" style="left:20px;top:20px;width:180px;">Implementation fidelity</div>

    <div class="node blue-strong-node" style="left:150px;top:42px;width:130px;height:52px;">
      ATRF / NTPR
    </div>
    <div class="fidelity-link" style="left:215px;top:94px;height:54px;"></div>

    <div class="node blue-strong-node" style="left:486px;top:42px;width:150px;height:52px;">
      WMTA / FRF
    </div>
    <div class="fidelity-link" style="left:561px;top:94px;height:54px;"></div>

    <div class="section-label" style="left:20px;top:134px;width:180px;">CPB information flow</div>

    <div class="node neutral-node" style="left:20px;top:165px;width:100px;height:60px;"><span>Source<br><i>S</i></span></div>
    <div class="arrow-right" style="left:124px;top:195px;width:32px;"></div>
    <div class="node blue-node" style="left:160px;top:165px;width:110px;height:60px;">Attention</div>
    <div class="arrow-right" style="left:274px;top:195px;width:32px;"></div>
    <div class="node neutral-node" style="left:310px;top:165px;width:140px;height:60px;"><span>Post-Attention<br>Input <i>P</i></span></div>
    <div class="arrow-right" style="left:454px;top:195px;width:28px;"></div>
    <div class="node blue-node" style="left:486px;top:165px;width:150px;height:60px;">Working<br>Memory</div>
    <div class="arrow-right" style="left:640px;top:195px;width:26px;"></div>
    <div class="node neutral-node" style="left:670px;top:165px;width:120px;height:60px;"><span>Available<br>Input <i>A</i></span></div>
    <div class="arrow-right" style="left:794px;top:195px;width:32px;"></div>
    <div class="node blue-node" style="left:830px;top:165px;width:100px;height:60px;">Encoding</div>
    <div class="arrow-right" style="left:934px;top:195px;width:32px;"></div>
    <div class="node neutral-node" style="left:970px;top:165px;width:130px;height:60px;"><span>Explicit<br>LTM <i>L</i></span></div>
    <div class="arrow-right" style="left:1104px;top:195px;width:32px;"></div>
    <div class="node neutral-node" style="left:1140px;top:165px;width:110px;height:60px;"><span>Answer<br><i>Y</i></span></div>

    <div class="section-label" style="left:90px;top:252px;width:220px;">Stage-specific outcomes</div>

    <div class="outcome-tick" style="left:70px;top:225px;height:100px;"></div>
    <div class="outcome-line" style="left:70px;top:325px;width:310px;"></div>
    <div class="outcome-tick" style="left:380px;top:225px;height:100px;"></div>
    <div class="metric-label" style="left:172px;top:288px;width:106px;height:34px;">
      <strong>AAR</strong><span>Source to P</span>
    </div>

    <div class="outcome-tick" style="left:380px;top:225px;height:150px;"></div>
    <div class="outcome-line" style="left:380px;top:375px;width:350px;"></div>
    <div class="outcome-tick" style="left:730px;top:225px;height:150px;"></div>
    <div class="metric-label" style="left:500px;top:338px;width:110px;height:34px;">
      <strong>WMAR</strong><span>P to A</span>
    </div>

    <div class="outcome-tick" style="left:730px;top:225px;height:200px;"></div>
    <div class="outcome-line" style="left:730px;top:425px;width:305px;"></div>
    <div class="outcome-tick" style="left:1035px;top:225px;height:200px;"></div>
    <div class="metric-label" style="left:838px;top:388px;width:110px;height:34px;">
      <strong>ESR</strong><span>A to LTM</span>
    </div>
  </main>
</body>
</html>
